name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    if: github.repository == 'WebMCP-org/rook-integrations'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "24.11.0"
          run-install: false
          version: "0.2.6"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.11.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.14.1
      - run: vp install --frozen-lockfile --ignore-scripts
      - run: vp exec playwright install --with-deps chromium
      - run: vp run check
      - name: Verify release version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm publish --access public
